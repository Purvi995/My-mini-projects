<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#667eea,#764ba2);

}



/* Main Border Box */

.container{

    width:450px;

    padding:40px;

    border:3px solid white;

    border-radius:25px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    box-shadow:
    0 20px 40px rgba(0,0,0,0.4);

    text-align:center;

}



/* Title */

h2{

    color:white;

    font-size:38px;

    margin-bottom:25px;

}



/* Inputs */

input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:12px;

    margin-top:10px;

    font-size:17px;

}



/* Button */

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:25px;

    background:#ff9800;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    background:#ff5722;

    transform:scale(1.05);

}




h3{

    color:white;

    margin-top:20px;

}



/* Expense list */


#expenseList{

    list-style:none;

    width:100%;

    min-height:80px;

    margin-top:15px;

    padding:10px;

    background:white;

    border-radius:15px;

}



#expenseList li{

    background:#080707;

    color:#333;

    padding:12px;

    margin:8px;

    border-radius:10px;

    font-weight:bold;

}



/* Total */


#total{

    background:#111;

    padding:15px;

    border-radius:15px;

    margin-top:20px;

    color:white;

}
</style>

    <body>

<div class="container">

    <h2>Expense Tracker</h2>

    Expense Name:
    <input type="text" id="expenseName">

    <br><br>

    Amount:
    <input type="number" id="amount">

    <br><br>

    <button onclick="addExpense()">Add Expense</button>

    <h3>Expenses:</h3>

    <ul id="expenseList"></ul>

    <h3 id="total">Total Expense</h3>

</div>

    <script>

let totalExpense = 0;


function addExpense(){

    let name = document.getElementById("expenseName").value;
    let amount = Number(document.getElementById("amount").value);


    if(name != "" && amount > 0){


        let li = document.createElement("li");


        li.innerHTML = `
            <span>${name}</span>
            <span>₹${amount}</span>
        `;


        document.getElementById("expenseList")
        .appendChild(li);



        totalExpense = totalExpense + amount;


        document.getElementById("total").innerHTML =
        "Total Expense: ₹" + totalExpense;



        document.getElementById("expenseName").value="";
        document.getElementById("amount").value="";

    }

}

</script>
</body>
</html>
