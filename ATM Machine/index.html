<body>
    <div class="atm">
        <h2>ATM Machine</h2>
        <p>Current Balance:   
                                <span id="balance">Rs. 5000</span></p>

        <input type="number" id="amount" placeholder="Enter Amount">
        <br><br>
        <button class="deposit" onclick="deposit()">Deposit</button>
        <button class="withdraw" onclick="withdraw()">Withdraw</button>
        <p id="message"></p>
    </div>

    <script>
        let balance=5000;
        function deposit(){
            let amount= Number(document.getElementById("amount").value)
            if(amount>0){
                balance=balance+amount;
                document.getElementById("balance").innerText=balance;
                document.getElementById("message").innerText="Rs." + amount + " Deposited Successfully.";
            }
            else{
                document.getElementById("message").innerText="Enter Valid Amount";
            }
        }
        function withdraw(){
            let amount= Number(document.getElementById("amount").value)
            if(amount>0){
                balance=balance-amount;
                document.getElementById("balance").innerText=balance;
                document.getElementById("message").innerText= "Rs." + amount + " Withdrawn Successfully.";
            }
            else{
                document.getElementById("message").innerText="Unsufficient Balance";
            }
        }

    </script>
</body>
